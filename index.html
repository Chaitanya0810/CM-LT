<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Computational Mathematics Lab - Topic Allocation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 25px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Computational Mathematics Lab</h1>

    <div class="subtitle">
        Topic Allocation
    </div>

    <form id="allocationForm">

        <label for="rollNo">Roll Number</label>

        <input
            type="text"
            id="rollNo"
            placeholder="Enter your Roll Number"
            required
        >

        <label for="topic">Select Your Topic</label>

        <select id="topic" required>

            <option value="">-- Select a Topic --</option>

            <!-- UNIT I -->

            <optgroup label="UNIT I - Eigen Values and Eigenvectors">

                <option>Real Eigenvalues using Characteristic Equation</option>
                <option>Complex Eigenvalues using Characteristic Equation</option>
                <option>Eigenvectors for Real Eigenvalues</option>
                <option>Eigenvectors for Complex Eigenvalues</option>
                <option>Eigenvalue Computation using Python</option>
                <option>Eigenvector Computation using Python</option>
                <option>Eigenvalues using MATLAB</option>
                <option>Eigenvectors using MATLAB</option>
                <option>Eigenvalue-Eigenvector Verification</option>
                <option>Characteristic Polynomial Computation</option>
                <option>Dominant Eigenvalue Computation</option>
                <option>Smallest Eigenvalue Computation</option>
                <option>Eigenvalues of a 2 × 2 Matrix</option>
                <option>Eigenvalues of a 3 × 3 Matrix</option>
                <option>Eigenvalues of a Symmetric Matrix</option>
                <option>Eigenvalues of a Diagonal Matrix</option>
                <option>Eigenvalues of a Triangular Matrix</option>
                <option>Eigenvalue Multiplicity Analysis</option>
                <option>Numerical Eigenvalue Analysis</option>
                <option>Graphical Analysis of Eigenvalues</option>

            </optgroup>


            <!-- UNIT II -->

            <optgroup label="UNIT II - Algebraic and Transcendental Equations">

                <option>Root Finding using Bisection Method</option>
                <option>Bisection Method with Error Analysis</option>
                <option>Bisection Method Iteration Table</option>
                <option>Bisection Method Convergence Analysis</option>
                <option>Bisection Method Graphical Visualization</option>
                <option>Bisection Method for Polynomial Equations</option>
                <option>Bisection Method for Transcendental Equations</option>
                <option>Root Finding using Newton-Raphson Method</option>
                <option>Newton-Raphson Method with Error Analysis</option>
                <option>Newton-Raphson Iteration Table</option>
                <option>Newton-Raphson Convergence Analysis</option>
                <option>Newton-Raphson Graphical Visualization</option>
                <option>Newton-Raphson for Polynomial Equations</option>
                <option>Newton-Raphson for Transcendental Equations</option>
                <option>Comparison of Bisection and Newton-Raphson Methods</option>
                <option>Accuracy Analysis of Root Finding Methods</option>
                <option>Stopping Criteria in Numerical Root Finding</option>
                <option>Initial Guess Analysis in Newton-Raphson</option>
                <option>Root Finding using Python</option>
                <option>Root Finding using MATLAB</option>

            </optgroup>


            <!-- UNIT III -->

            <optgroup label="UNIT III - Linear System of Equations">

                <option>Jacobi Iteration Method</option>
                <option>Jacobi Method Iteration Table</option>
                <option>Jacobi Method Convergence Analysis</option>
                <option>Jacobi Method Error Analysis</option>
                <option>Jacobi Method for 2 × 2 Systems</option>
                <option>Jacobi Method for 3 × 3 Systems</option>
                <option>Jacobi Method for 4 × 4 Systems</option>
                <option>Jacobi Method using Python</option>
                <option>Jacobi Method using MATLAB</option>
                <option>Gauss-Seidel Iteration Method</option>
                <option>Gauss-Seidel Iteration Table</option>
                <option>Gauss-Seidel Convergence Analysis</option>
                <option>Gauss-Seidel Error Analysis</option>
                <option>Gauss-Seidel Method for 2 × 2 Systems</option>
                <option>Gauss-Seidel Method for 3 × 3 Systems</option>
                <option>Gauss-Seidel Method for 4 × 4 Systems</option>
                <option>Gauss-Seidel Method using Python</option>
                <option>Gauss-Seidel Method using MATLAB</option>
                <option>Comparison of Jacobi and Gauss-Seidel Methods</option>
                <option>Iterative Methods for Linear Systems</option>

            </optgroup>


            <!-- UNIT IV -->

            <optgroup label="UNIT IV - First-Order ODEs">

                <option>Exact Differential Equations</option>
                <option>Non-Exact Differential Equations</option>
                <option>Testing Exactness of a Differential Equation</option>
                <option>Solution of Exact Differential Equations</option>
                <option>Solution of Non-Exact Differential Equations</option>
                <option>Integrating Factor for Non-Exact Equations</option>
                <option>Exact Equation Verification using Python</option>
                <option>Non-Exact Equation Verification using Python</option>
                <option>Exponential Growth Model</option>
                <option>Exponential Decay Model</option>
                <option>Exponential Growth Numerical Solution</option>
                <option>Exponential Decay Numerical Solution</option>
                <option>Growth and Decay Graphical Analysis</option>
                <option>Population Growth Application</option>
                <option>Radioactive Decay Application</option>
                <option>Newton's Law of Cooling</option>
                <option>Newton's Law of Cooling Numerical Solution</option>
                <option>Newton's Law of Cooling Graphical Analysis</option>
                <option>Temperature Prediction using Newton's Cooling Law</option>
                <option>First-Order ODE Applications using Python</option>

            </optgroup>


            <!-- UNIT V -->

            <optgroup label="UNIT V - Higher-Order Linear Differential Equations">

                <option>Homogeneous Higher-Order ODEs</option>
                <option>Non-Homogeneous Higher-Order ODEs</option>
                <option>Auxiliary Equation Method</option>
                <option>Complementary Function of Homogeneous ODE</option>
                <option>Particular Integral of Non-Homogeneous ODE</option>
                <option>Distinct Real Roots in Homogeneous ODE</option>
                <option>Repeated Real Roots in Homogeneous ODE</option>
                <option>Complex Roots in Homogeneous ODE</option>
                <option>Higher-Order ODE with Polynomial RHS</option>
                <option>Higher-Order ODE with Exponential RHS</option>
                <option>Higher-Order ODE with Trigonometric RHS</option>
                <option>Higher-Order ODE with Mixed RHS</option>
                <option>Homogeneous ODE using Python</option>
                <option>Non-Homogeneous ODE using Python</option>
                <option>Homogeneous ODE using MATLAB</option>
                <option>Non-Homogeneous ODE using MATLAB</option>
                <option>Higher-Order ODE Solution Verification</option>
                <option>Higher-Order ODE Graphical Visualization</option>
                <option>Comparison of Homogeneous and Non-Homogeneous ODEs</option>
                <option>Numerical Analysis of Higher-Order ODEs</option>

            </optgroup>

        </select>

        <button type="submit" id="submitBtn">
            Allocate Topic
        </button>

    </form>


    <div id="message"></div>

    <div class="note">
        <b>Important:</b> Each student can select only one topic,
        and each topic can be selected by only one student.
    </div>

</div>


<script>

    // YOUR NEW GOOGLE APPS SCRIPT URL
    const API_URL =
        "https://script.google.com/macros/s/AKfycbycnldVkRI94kqgZYYdXhk90Z3vFV0oP-RclCIZwNOgwjKkWuEBXUFWGITQI53lwB25/exec";


    const form = document.getElementById("allocationForm");
    const rollNoInput = document.getElementById("rollNo");
    const topicInput = document.getElementById("topic");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const rollNo = rollNoInput.value.trim();
        const topic = topicInput.value.trim();


        if (rollNo === "") {

            showMessage(
                "Please enter your Roll Number.",
                "error"
            );

            return;
        }


        if (topic === "") {

            showMessage(
                "Please select a topic.",
                "error"
            );

            return;
        }


        submitBtn.disabled = true;
        submitBtn.innerText = "Checking...";


        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },

                body: JSON.stringify({
                    rollNo: rollNo,
                    topic: topic
                })

            });


            const result = await response.json();


            if (result.success) {

                showMessage(
                    "✅ " + result.message,
                    "success"
                );

                // Prevent another submission from the same page
                rollNoInput.disabled = true;
                topicInput.disabled = true;

                submitBtn.innerText = "Topic Allocated";

            } else {

                showMessage(
                    "❌ " + result.message,
                    "error"
                );

                submitBtn.disabled = false;
                submitBtn.innerText = "Allocate Topic";
            }


        } catch (error) {

            showMessage(
                "❌ Something went wrong. Please try again.",
                "error"
            );

            submitBtn.disabled = false;
            submitBtn.innerText = "Allocate Topic";

        }

    });


    function showMessage(text, type) {

        message.innerText = text;

        message.className = type;

        message.style.display = "block";

    }

</script>

</body>
</html>
